version: 2
# target-branch is a literal on every entry (it takes no expressions); update all of
# them if the default branch is renamed (see Chapter 11.8).
updates:
  # Frontend (React/Vite) dependencies
  - package-ecosystem: npm
    directory: /frontend
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  # Backend and engine Python dependencies (requirements.txt is at the repo root)
  - package-ecosystem: pip
    directory: /
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend

  # Metrics collector (monitoring/requirements.txt) and Locust load tests
  # (load_tests/requirements.txt) have their own pinned requirements files
  - package-ecosystem: pip
    directory: /monitoring
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - monitoring

  - package-ecosystem: pip
    directory: /load_tests
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - load-tests

  # Base images in the Dockerfiles (backend at the root, frontend in /frontend)
  - package-ecosystem: docker
    directory: /
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /frontend
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker

  # GitHub Actions versions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    target-branch: "25april"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
